# Alloy writes the host's and each container's usage in; Prometheus scrapes the proxy and itself.
global:
  scrape_interval: 15s
  external_labels:
    environment: staging

scrape_configs:
  - job_name: traefik
    static_configs:
      - targets: ["traefik:8082"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
