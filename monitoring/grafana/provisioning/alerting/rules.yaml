# Staging's alert rules, all routed to telegram-operator.
apiVersion: 1

groups:
  - orgId: 1
    name: staging
    folder: Staging
    interval: 1m
    rules:
      - uid: greeter-down
        title: Greeter is down
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              expr: 'sum(traefik_service_server_up{service="greeter@docker"}) or vector(0)'
              instant: true
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: lt
                    params:
                      - 1
        for: 2m
        noDataState: Alerting
        execErrState: Error
        labels:
          environment: staging
        annotations:
          summary: No greeter container on staging passes its health check.
      - uid: greeter-errors
        title: Greeter answers with errors
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              expr: 'sum(rate(traefik_service_requests_total{service="greeter@docker",code=~"5.."}[5m])) / sum(rate(traefik_service_requests_total{service="greeter@docker"}[5m]))'
              instant: true
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 0.05
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          environment: staging
        annotations:
          summary: More than 5% of greeter's answers on staging are 5xx.
      - uid: host-disk
        title: Staging's disk is nearly full
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              expr: 'min(node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100'
              instant: true
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: lt
                    params:
                      - 10
        for: 10m
        noDataState: NoData
        execErrState: Error
        labels:
          environment: staging
        annotations:
          summary: Less than 10% of staging's disk is free.
